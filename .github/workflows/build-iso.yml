
name: Build 44OS Live ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates \
            file

      - name: Verify Debian environment
        run: |
          cat /etc/os-release
          lb --version
          df -h

      - name: Build 44OS ISO
        run: bash ./build-44os.sh

      - name: Verify ISO
        run: |
          ls -lh dist/*.iso
          file dist/*.iso
          sha256sum dist/*.iso > dist/SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: 44OS-0.4-alpha-live-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 7
