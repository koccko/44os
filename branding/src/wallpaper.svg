<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- 44OS "Horizon" wallpaper: deep space gradient, soft aurora, planetary rim light. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#101833"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="160"/></filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6CFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#8A6CFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7FE3FF" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#5E9BFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5E9BFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#121A33"/>
      <stop offset="1" stop-color="#03040A"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <ellipse cx="1250" cy="1500" rx="1300" ry="300" fill="#7A5CFF" opacity="0.30" transform="rotate(-6 1250 1500)"/>
    <ellipse cx="2650" cy="1450" rx="1250" ry="280" fill="#2FB8FF" opacity="0.26" transform="rotate(5 2650 1450)"/>
    <ellipse cx="1920" cy="1640" rx="1500" ry="220" fill="#4D7DFF" opacity="0.30"/>
  </g>
  <circle cx="1920" cy="5650" r="4000" fill="url(#planet)"/>
  <circle cx="1920" cy="5650" r="4000" fill="none" stroke="url(#rim)" stroke-width="22" opacity="0.55" filter="url(#glow)"/>
  <circle cx="1920" cy="5650" r="4000" fill="none" stroke="url(#rim)" stroke-width="3" opacity="0.95"/>
  <g fill="#FFFFFF">
    <circle cx="612" cy="318" r="2" opacity=".45"/><circle cx="1404" cy="190" r="1.6" opacity=".35"/>
    <circle cx="2210" cy="402" r="1.8" opacity=".4"/><circle cx="3012" cy="236" r="2.2" opacity=".5"/>
    <circle cx="3480" cy="690" r="1.5" opacity=".3"/><circle cx="288" cy="820" r="1.6" opacity=".3"/>
    <circle cx="1010" cy="640" r="1.3" opacity=".3"/><circle cx="2760" cy="760" r="1.4" opacity=".28"/>
    <circle cx="1730" cy="520" r="1.2" opacity=".25"/><circle cx="3310" cy="1010" r="1.3" opacity=".22"/>
  </g>
</svg>
