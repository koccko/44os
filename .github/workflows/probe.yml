name: Probe Debian trixie (temporary)
on:
  push:
    branches: [feature/nova-0.6]
    paths: [.github/probe.sh, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/.github/probe.sh:/probe.sh:ro" -v "$PWD/out:/out" debian:trixie bash /probe.sh || true
          cd out && git init -q -b results && git config user.name 44os-ci && git config user.email 44os-ci@users.noreply.github.com
          git add -A && git commit -qm probe && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "results:refs/heads/ci-results/probe-${{ github.run_id }}"
