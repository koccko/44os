name: Build 44OS Live ISO

# Pipeline:
#   build          lint (scripts, hooks, QML, packages) → live-build → static ISO verification
#   boot-test      firmware/bootloader paths: UEFI DVD/USB, Secure Boot, BIOS (QEMU)
#   desktop-test   live Plasma session: 44Welcome, top bar, 44Dock, 44Launcher, decoration, About
#   install-test   Calamares install → reboot without ISO → SDDM/TTY login → password change
#   boot-test-virtualbox   VirtualBox EFI reaches the boot menu (non-blocking: runner support varies)
# Runtime jobs publish summaries and screenshots as artifacts and, for runs in
# this repository, to ci-results/<run>-<job> branches.

on:
  workflow_dispatch:
    inputs:
      iso_run_id:
        description: "Skip the build and test the ISO artifact of this run id"
        required: false
        default: ""
  pull_request:
    branches: [main, fix/uefi-boot-desktop-refresh]

permissions:
  contents: read
  actions: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 0.6-alpha

jobs:
  build:
    if: ${{ !inputs.iso_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates \
            file \
            python3-pyqt6.qtqml \
            python3-pyqt6.qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts

      - name: Verify Debian environment
        run: |
          cat /etc/os-release
          lb --version
          df -h

      - name: Lint build scripts, hooks and session scripts
        run: |
          bash -n build-44os.sh scripts/*.sh .github/scripts/*.sh
          for h in config/hooks/live/*.hook.chroot config/includes.chroot/usr/libexec/44os/* config/includes.chroot/usr/bin/44welcome; do
            sh -n "$h"
          done
          python3 -m py_compile config/includes.chroot/usr/share/44os/welcome/welcome.py branding/*.py
          for j in $(find config -name '*.json'); do python3 -m json.tool "$j" >/dev/null; done

      - name: Parse-check QML (plasmoids, splash, 44Welcome, Calamares slideshow)
        run: QT_QPA_PLATFORM=offscreen python3 scripts/check-qml.py $(find config -name '*.qml')

      - name: Verify package lists against Debian trixie
        run: scripts/check-packages.sh

      - name: Build 44OS ISO
        run: |
          set -o pipefail
          bash ./build-44os.sh 2>&1 | tee build.log

      - name: Report build notes
        if: always()
        run: |
          grep -E '^44OS:' build.log > build-notes.txt || true
          cat build-notes.txt
          .github/scripts/annotate.sh notice "build notes" build-notes.txt 4000

      - name: Report build failure
        if: failure()
        run: |
          grep -nE '44OS:|E:|ERROR|VERIFY|[Ff]ailed|fatal|Unable to|unknown option|not found' build.log | tail -n 40 > build-errors.txt || true
          tail -n 60 build.log > build-tail.txt
          .github/scripts/annotate.sh error "build errors" build-errors.txt 4000
          .github/scripts/annotate.sh error "build log tail" build-tail.txt 4000

      - name: Verify ISO
        run: |
          ls -lh dist/*.iso
          file dist/*.iso
          scripts/verify-iso.sh dist/*.iso
          (cd dist && sha256sum *.iso > SHA256SUMS)

      - name: Upload ISO artifact
        if: always() && hashFiles('dist/*.iso') != ''
        uses: actions/upload-artifact@v4
        with:
          name: 44OS-${{ env.VERSION }}-live-amd64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  boot-test:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.iso_run_id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 44OS-${{ env.VERSION }}-live-amd64
          path: dist
          run-id: ${{ inputs.iso_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU, OVMF and OCR tools
        run: .github/scripts/setup-vm-host.sh
      - name: "UEFI (OVMF), DVD: firmware → GRUB menu (unmodified ISO)"
        run: ISO=$(ls dist/*.iso) NAME=uefi-dvd FW=uefi MEDIA=cdrom DURATION=60 REQUIRE=grub OUT=out/uefi-dvd .github/scripts/boot-test.sh
      - name: "UEFI (OVMF), USB stick: firmware → GRUB menu (unmodified ISO)"
        run: ISO=$(ls dist/*.iso) NAME=uefi-usb FW=uefi MEDIA=usb DURATION=60 REQUIRE=grub OUT=out/uefi-usb .github/scripts/boot-test.sh
      - name: "UEFI Secure Boot (OVMF, Microsoft keys): shim → GRUB → kernel"
        run: ISO=$(ls dist/*.iso) NAME=uefi-sb FW=uefi-sb MEDIA=cdrom DURATION=240 REQUIRE=kernel SERIAL_ISO=1 OUT=out/uefi-sb .github/scripts/boot-test.sh
      - name: "BIOS (SeaBIOS), DVD: isolinux menu"
        run: ISO=$(ls dist/*.iso) NAME=bios FW=bios MEDIA=cdrom DURATION=60 REQUIRE=grub OUT=out/bios .github/scripts/boot-test.sh
      - name: Report
        if: always()
        run: for d in out/*/; do .github/scripts/annotate.sh notice "boot $(basename "$d")" "$d/result.txt" 3500; done
      - name: Publish results
        if: always() && github.event.pull_request.head.repo.fork != true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: .github/scripts/publish-results.sh out boot
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: boot-test-results, path: out/, retention-days: 7 }
    permissions:
      contents: write
      actions: read

  desktop-test:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.iso_run_id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 44OS-${{ env.VERSION }}-live-amd64
          path: dist
          run-id: ${{ inputs.iso_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU, OVMF and OCR tools
        run: .github/scripts/setup-vm-host.sh
      - name: "Live desktop: 44Welcome, top bar, 44Dock, 44Launcher, decoration, About"
        run: ISO=$(ls dist/*.iso) OUT=out/desktop .github/scripts/desktop-test.sh
      - name: Report
        if: always()
        run: |
          cat out/desktop/summary.txt || true
          .github/scripts/annotate.sh notice "desktop test summary" out/desktop/summary.txt 3500
      - name: Publish results
        if: always() && github.event.pull_request.head.repo.fork != true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: .github/scripts/publish-results.sh out/desktop desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: |
            out/desktop/*.png
            out/desktop/*.txt
            out/desktop/*.log
          retention-days: 7

  install-test:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.iso_run_id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/download-artifact@v4
        with:
          name: 44OS-${{ env.VERSION }}-live-amd64
          path: dist
          run-id: ${{ inputs.iso_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU, OVMF and OCR tools
        run: .github/scripts/setup-vm-host.sh
      - name: "Install lifecycle: Calamares → reboot without ISO → SDDM/TTY login → passwd"
        run: ISO=$(ls dist/*.iso) OUT=out/install .github/scripts/install-test.sh
      - name: Report
        if: always()
        run: |
          cat out/install/summary.txt || true
          .github/scripts/annotate.sh notice "install test summary" out/install/summary.txt 3500
      - name: Publish results
        if: always() && github.event.pull_request.head.repo.fork != true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: .github/scripts/publish-results.sh out/install install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-results
          path: |
            out/install/*.png
            out/install/*.txt
            out/install/*.log
          retention-days: 7

  boot-test-virtualbox:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.iso_run_id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # VirtualBox needs a kernel module built for the runner kernel; treat
    # infrastructure failures as non-blocking but report the result.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 44OS-${{ env.VERSION }}-live-amd64
          path: dist
          run-id: ${{ inputs.iso_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install VirtualBox
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-headers-$(uname -r) tesseract-ocr tesseract-ocr-eng imagemagick
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y virtualbox
          sudo modprobe -r kvm_intel kvm_amd kvm 2>/dev/null || true
          sudo modprobe vboxdrv
          VBoxManage --version
      - name: "VirtualBox EFI, DVD: firmware → GRUB menu"
        run: |
          sudo -E env ISO=$(ls dist/*.iso) HV=vbox NAME=vbox-efi FW=uefi DURATION=90 REQUIRE=grub OUT=out/vbox-efi \
            .github/scripts/boot-test.sh
      - name: Report results
        if: always()
        run: |
          sudo chown -R "$USER" out || true
          .github/scripts/annotate.sh notice "boot vbox-efi" out/vbox-efi/result.txt 3500
