name: Diagnose ISO boot regression

on:
  push:
    branches: [fix/uefi-boot-desktop-refresh]
    paths: [.github/workflows/diagnose-boot.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qemu:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: v03, run: "39924037515", artifact: 44OS-0.3-alpha-live-amd64 }
          - { tag: v04, run: "39950420411", artifact: 44OS-0.4-alpha-live-amd64 }
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: iso
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso mtools socat tesseract-ocr imagemagick fdisk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
      - name: Structural report
        run: |
          ISO=$(ls iso/*.iso); R=report.txt
          { echo "== $ISO"; ls -l "$ISO"; sha256sum "$ISO"; file "$ISO"
            echo "== fdisk"; fdisk -l "$ISO" || true
            echo "== el torito"; xorriso -indev "$ISO" -report_el_torito plain 2>&1 | grep -v '^xorriso :' || true
            echo "== system area"; xorriso -indev "$ISO" -report_system_area plain 2>&1 | grep -v '^xorriso :' || true
            echo "== /EFI /boot/grub"; xorriso -indev "$ISO" -find /EFI /boot/grub -maxdepth 2 -exec lsdl 2>/dev/null | head -n 60 || true
            echo "== /isolinux"; xorriso -indev "$ISO" -ls /isolinux 2>/dev/null | head -n 40 || true
            echo "== /live"; xorriso -indev "$ISO" -lsdl /live 2>/dev/null || true
          } > $R 2>&1
          mkdir -p x; osirrox -indev "$ISO" -extract /boot/grub x/grub >/dev/null 2>&1 || true
          osirrox -indev "$ISO" -extract /EFI x/EFI >/dev/null 2>&1 || true
          { echo "== find x"; find x -maxdepth 3 | sort | head -n 80
            for img in x/grub/efi.img $(find x -name 'efi*.img'); do [ -f "$img" ] || continue
              echo "== $img"; ls -l "$img"; mdir -/ -i "$img" :: || true
              mcopy -n -i "$img" ::/EFI/boot/grub.cfg /dev/stdout 2>/dev/null || mcopy -n -i "$img" ::/EFI/debian/grub.cfg /dev/stdout 2>/dev/null || true
              mdir -/ -i "$img" :: 2>/dev/null | grep -i efi; for f in bootx64.efi grubx64.efi mmx64.efi; do mcopy -n -i "$img" ::/EFI/boot/$f /tmp/$f 2>/dev/null && sha256sum /tmp/$f; done
            done
            echo "== grub.cfg"; cat x/grub/grub.cfg 2>/dev/null | head -n 80
            echo "== other cfg"; for f in x/grub/*.cfg; do echo "-- $f"; head -n 30 "$f"; done
          } > report2.txt 2>&1
          .github/scripts/annotate.sh notice "${{ matrix.tag }} structure" report.txt
          .github/scripts/annotate.sh notice "${{ matrix.tag }} efi+grub" report2.txt
      - name: Boot UEFI cdrom
        continue-on-error: true
        run: |
          ISO=$(ls iso/*.iso) NAME=uefi-cd FW=uefi MEDIA=cdrom DURATION=60 REQUIRE=none OUT=b1 .github/scripts/boot-test.sh || true
          .github/scripts/annotate.sh notice "${{ matrix.tag }} uefi cdrom" b1/result.txt
          .github/scripts/annotate-image.sh "${{ matrix.tag }}-uefi-cd" "$(ls b1/shot-*.png | sed -n 3p)" 800
      - name: Boot UEFI usb
        continue-on-error: true
        run: |
          ISO=$(ls iso/*.iso) NAME=uefi-usb FW=uefi MEDIA=usb DURATION=40 REQUIRE=none OUT=b2 .github/scripts/boot-test.sh || true
          .github/scripts/annotate.sh notice "${{ matrix.tag }} uefi usb" b2/result.txt
      - name: Boot UEFI secure boot cdrom
        continue-on-error: true
        run: |
          ISO=$(ls iso/*.iso) NAME=uefi-sb FW=uefi-sb MEDIA=cdrom DURATION=40 REQUIRE=none OUT=b3 .github/scripts/boot-test.sh || true
          .github/scripts/annotate.sh notice "${{ matrix.tag }} uefi secureboot" b3/result.txt
      - name: Boot BIOS cdrom
        continue-on-error: true
        run: |
          ISO=$(ls iso/*.iso) NAME=bios FW=bios MEDIA=cdrom DURATION=40 REQUIRE=none OUT=b4 .github/scripts/boot-test.sh || true
          .github/scripts/annotate.sh notice "${{ matrix.tag }} bios" b4/result.txt

  vbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/download-artifact@v4
        with: { name: 44OS-0.3-alpha-live-amd64, path: iso03, run-id: "39924037515", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: 44OS-0.4-alpha-live-amd64, path: iso04, run-id: "39950420411", github-token: "${{ github.token }}" }
      - name: Install VirtualBox
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r) tesseract-ocr imagemagick socat
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y virtualbox
          sudo modprobe -r kvm_intel kvm_amd kvm 2>/dev/null || true
          sudo modprobe vboxdrv; lsmod | grep vbox; VBoxManage --version
      - name: VirtualBox EFI boot 0.3 and 0.4
        continue-on-error: true
        run: |
          for v in 03 04; do
            sudo -E env ISO=$(ls iso$v/*.iso) HV=vbox NAME=vbox$v FW=uefi DURATION=90 REQUIRE=none OUT=vb$v .github/scripts/boot-test.sh || true
            sudo chown -R $USER vb$v || true
            .github/scripts/annotate.sh notice "v$v vbox efi" vb$v/result.txt
            grep -aiE 'efi|boot|error|VERR' vb$v/VBox-internal.log | tail -n 60 > vb$v/vboxlog.txt || true
            .github/scripts/annotate.sh notice "v$v vbox internal log" vb$v/vboxlog.txt
            .github/scripts/annotate-image.sh "v$v-vbox" "$(ls vb$v/shot-*.png | sed -n 3p)" 800
          done
